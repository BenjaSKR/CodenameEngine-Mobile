name: Android Build
on: workflow_dispatch
jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Restore Previous Cache
        uses: actions/cache@v4
        with:
          # not caching the bin folder to prevent asset duplication and stuff like that
          key: cache-build-android
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
            export\release\windows\haxe\
            export\release\windows\obj\
            .haxelib\
          restore-keys: |
            cache-build-android

      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Build Lime native library
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev libxss-dev libxfixes-dev libxtst-dev libwayland-bin libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libpipewire-0.3-dev libspa-0.2-dev libjack-dev libsndio-dev libibus-1.0-dev libusb-1.0-0-dev
          cd .haxelib/lime/git/tools
          haxe tools.hxml
          cd ../../../..
          haxelib run lime rebuild linux -release

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Fix Haxelib
        run: |
          haxelib set lime git
          haxelib set hxcpp git
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flixel-animate git
          haxelib set hxdiscord_rpc git

      - name: Build Lime native library for Android
        run: |
          LIME=.haxelib/lime/git
          git -C $LIME log -1 --format="Lime commit: %H %s"
          rm -rf $LIME/project/obj
          rm -rf $LIME/ndll/Android
          F=$(find $LIME/project -name OpenGLBindings.cpp | head -n 1)
          sed -i 's/\bglClearDepth\b *(/glClearDepthf (/g' "$F"
          sed -i 's/\bglDepthRange\b *(/glDepthRangef (/g' "$F"
          S=$LIME/project/src/backend/sdl/SDLSystem.cpp
          sed -i 's/void \*JNI::GetEnv () {/void *JNI_GetEnv_unused () {/' "$S"
          B=$LIME/project/Build.xml
          sed -i 's|<lib name="-L../ndll/Android" />|<lib name="-L../ndll/Android" /><lib name="-lGLESv3" />|' "$B"
          echo "== Parches aplicados"
          grep -n "GLESv3" "$B"
          grep -rn "GetEnv *() *{\|JNI_GetEnv_unused" $LIME/project/src | grep -v "(JNIEnv" || true
          haxelib run lime rebuild android -arm64 -release -clean

      - name: Building the game
        run: |
          haxelib run lime build android -final -D ONLY_ARM64

      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Android
          path: export/release/android/bin/app/build/outputs/apk/*

      - name: Clear Previous Cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-android") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }

      - name: Upload New Cache
        uses: actions/cache@v4
        with:
          # caching again since for some reason it doesnt work with the first post cache shit
          key: cache-build-android
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
            export\release\windows\haxe\
            export\release\windows\obj\
            .haxelib\
          restore-keys: |
            cache-build-android
